[project]
name = "atlas-etl-ldap"
version = "2.0.5"
description = "Atlas BI Library LDAP ETL"
authors = [
  { name = "Christopher Pickering", email = "cpickering@rhc.net" },
]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "pyodbc>=5.0.0",
  "ldap3>=2.9.1",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["test*"]
lint.ignore = ["E501", "D211", "D213"]
lint.select = [
  "F",
  "E",
  "W",
  "N",
  "D",
  "S",
  "B",
  "C4",
  "T20",
  "Q",
  "SIM",
  "ERA",
  "PL",
  "RUF",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
build_command = ""
allow_zero_version = false

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.branches.alpha]
match = "alpha"
prerelease = true
prerelease_token = "alpha"
