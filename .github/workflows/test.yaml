name: test

on:
  push:
    branches: [dev, alpha, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    services:
      ldap:
        image: osixia/openldap:1.5.0
        ports:
        - 389:389
        - 636:636
        env:
          LDAP_ORGANISATION: example
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: adminpassword

    steps:
    - uses: actions/checkout@v7

    - name: Check LDAP is up
      run: |
        sudo apt-get update
        sudo apt-get install -y ldap-utils
        ldapsearch -x -b "dc=example,dc=org" -D "cn=admin,dc=example,dc=org" -w "adminpassword"

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint
      run: uv run ruff check .

    - name: Install Microsoft ODBC
      run: sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

    - name: Install SQL Server
      uses: potatoqualitee/mssqlsuite@v1.12
      with:
        install: sqlengine, sqlpackage

    - name: Setup database
      run: sqlcmd -S localhost -U sa -P dbatools.I0 -d Master -C -i LDAPDatabaseCreationScript.sql

    - name: Run tests
      run: uv run pytest tests.py -q
      env:
        LDAP_HOST: ldap://localhost:389
        LDAP_USERNAME: cn=admin,dc=example,dc=org
        LDAP_PASSWORD: adminpassword
        DATABASE: DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost;DATABASE=LDAP;UID=sa;PWD=dbatools.I0;TrustServerCertificate=YES
        AD_DOMAIN: ""
        LDAP_BASE: dc=example,dc=org
        LDAP_USER_SEARCH: (objectClass=inetOrgPerson)
        LDAP_GROUP_SEARCH: (objectClass=groupOfNames)
        LDAP_USE_SSL: "false"
        LDAP_USE_TLS: "false"
